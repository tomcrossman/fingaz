};

function taunt(kind) {
    const set = (TAUNTS[difficulty] || TAUNTS.normal)[kind];
    return set && set.length ? set[(Math.random() * set.length) | 0] : '';
}

function rivalSays(kind) {
    if (gameState.mode !== 'ai') return;
    const line = taunt(kind);
    if (line) gameState.rivalLine = line;

    const face = document.getElementById('p2-avatar');
    if (!face) return;
    const mood = kind === 'hurt' ? 'rattled' : (kind === 'ko' ? 'gloating' : null);
    if (!mood) return;
    face.classList.remove('rattled', 'gloating');
    void face.offsetWidth;
    face.classList.add(mood);
    setTimeout(() => face.classList.remove(mood), mood === 'rattled' ? 1700 : 800);
}

/* ============================================================
   RECORD + DIFFICULTY
   ============================================================ */
const RIVALS = {
    easy:   { name: 'Momo',     title: 'the Apprentice', art: 'momo',  level: 'Easy' },
    normal: { name: 'Kurogane', title: 'the Duelist',    art: 'rival', level: 'Normal' },
    hard:   { name: 'Yurei',    title: 'the Phantom',    art: 'yurei', level: 'Hard' }
};
const rival = () => RIVALS[difficulty] || RIVALS.normal;
let difficulty = 'normal';
let history = [];

function loadSaved() {
    try {
        history = JSON.parse(localStorage.getItem('fingaz-history') || '[]');
        const d = localStorage.getItem('fingaz-diff');
        if (DIFFS[d]) difficulty = d;
    } catch (e) { history = []; }
}
function persist() {
    try {
        localStorage.setItem('fingaz-history', JSON.stringify(history.slice(-60)));
        localStorage.setItem('fingaz-diff', difficulty);
    } catch (e) { /* file:// or private mode — session-only is fine */ }
}
function recordResult(winner) {
    history.push({ w: winner, m: gameState.mode, d: difficulty });
    persist();
}

function setDifficulty(d) {
    difficulty = d;
    playSound('select');
    persist();
    renderStats();
    updateUI();            // swap in that rival's name and portrait
    say(`${rival().name}, ${rival().title}, steps up.`);
}

function openStats() { playSound('tap'); document.getElementById('stats').hidden = false; renderStats(); }
function closeStats() { playSound('tap'); document.getElementById('stats').hidden = true; }

function renderStats() {
    const wins = history.filter(h => h.w === 'p1').length;
    const losses = history.length - wins;
    document.getElementById('stats-tally').innerHTML = `
        <div class="col"><span class="who">You</span><span class="p1">${wins}</span></div>
        <div class="col"><span class="who">played</span><span style="opacity:.35">${history.length}</span></div>
        <div class="col"><span class="who">Rival</span><span class="p2">${losses}</span></div>`;

    document.getElementById('diff-row').innerHTML = Object.entries(RIVALS).map(([k, r]) =>
        `<button class="btn${k === difficulty ? ' on' : ''}" onclick="setDifficulty('${k}')">
            <span class="face">${renderPortrait(r.art)}</span>${r.name}<span class="sub">${r.level}</span>
         </button>`
    ).join('');

    const list = document.getElementById('stats-list');
    if (!history.length) {
        list.innerHTML = '<div class="stats-empty">No games yet — go throw some fingaz!</div>';
        return;
    }
    list.innerHTML = history.slice().reverse().slice(0, 20).map(h => {
        const youWon = h.w === 'p1';
        const foe = h.m === 'ai' ? ((RIVALS[h.d] || {}).name || 'Rival') : 'Player 2';
        return `<div class="stats-row ${youWon ? 'won' : 'lost'}">
                    <span>${youWon ? 'You won' : foe + ' won'}</span>
                    <span class="tag">${h.m === 'ai' ? ((RIVALS[h.d] || {}).level || h.d) : '2 player'}</span>
                </div>`;
    }).join('');
}

/* ============================================================
   TURNS + CPU
   ============================================================ */
function switchTurn() {
    gameState.selectedHand = null;
    gameState.activeSpecial = null;
    gameState.turn = other(gameState.turn);
    updateUI();
    if (gameState.mode === 'ai' && gameState.turn === 'p2') {
        // let the reaction sit for a beat, then go quiet while it thinks
        setTimeout(() => { gameState.rivalLine = null; updateUI(); }, 620);
        setTimeout(cpuTurn, 950);
    }
}

/* every legal attack, with what it achieves and what it exposes */
function cpuMoves() {
    const p2 = gameState.p2, p1 = gameState.p1;
    const mine = ['left', 'right'].filter(s => p2[s] > 0);
    const yours = ['left', 'right'].filter(s => p1[s] > 0);
    const out = [];
    for (const a of mine) for (const d of yours) {
        const total = p2[a] + p1[d];
        const kills = total >= 5;
        const after = { left: p1.left, right: p1.right };
        after[d] = kills ? 0 : total;
        let threats = 0;
        ['left', 'right'].forEach(pa => {
            if (after[pa] > 0) ['left', 'right'].forEach(pd => {
                if (p2[pd] > 0 && after[pa] + p2[pd] >= 5) threats++;
            });
        });
        out.push({ a, d, kills, wins: kills && yours.length === 1, threats });
    }
    return out;
}

function cpuTurn() {
    if (gameState.turn !== 'p2' || gameState.mode !== 'ai') return;
    const p2 = gameState.p2, p1 = gameState.p1;
    const yours = ['left', 'right'].filter(s => p1[s] > 0);
    const moves = cpuMoves();
    if (!moves.length) return;

    const rand = arr => arr[(Math.random() * arr.length) | 0];
    const go = m => executeAttack(m.a, m.d);
    const winning = moves.find(m => m.wins);

    if (difficulty === 'easy') {
        // often misses the finish, rarely trims — beatable by a child
        if (winning && Math.random() < .35) return go(winning);
        if (canHalfSplit('p2') && Math.random() < .5) return triggerHalfSplit();
        if (p2.abilities.subtraction && yours.length === 1 && Math.random() < .2) return cpuTrim(yours[0], 1);
        return go(rand(moves));
    }

    if (difficulty === 'hard') {
        if (winning) return go(winning);
        if (p2.abilities.subtraction && yours.length === 1) return cpuTrim(yours[0], p1[yours[0]]);
        if (canHalfSplit('p2')) return triggerHalfSplit();
        // prefer a knockout, and among equals the move that leaves it least exposed
        const kills = moves.filter(m => m.kills);
        const pool = kills.length ? kills : moves;
        const safest = Math.min(...pool.map(m => m.threats));
        return go(rand(pool.filter(m => m.threats === safest)));
    }

    // normal
    if (winning) return go(winning);
    if (canHalfSplit('p2')) return triggerHalfSplit();
    if (p2.abilities.subtraction && yours.length) {
        if (yours.length === 1) return cpuTrim(yours[0], p1[yours[0]]);
        if (Math.random() < .45) {
            const t = yours.reduce((a, b) => (p1[a] >= p1[b] ? a : b));
            return cpuTrim(t, Math.min(p1[t], 1 + ((Math.random() * 2) | 0)));
        }
    }
    return go(moves.find(m => m.kills) || rand(moves));
}

function cpuTrim(side, amount) {
    const left = Math.max(0, gameState.p1[side] - amount);
    gameState.p1[side] = left;
    gameState.p2.abilities.subtraction = false;
    rivalSays('trim');
    playSound('slash');
    const id = `p1-hand-${side}`;
    if (left === 0) burstConfetti(...centerOf(id), ['#2fa8e0', '#cdeaff'], 30);
    popBurst(id, `−${amount}`, 'var(--p1)');
    say(`The rival trimmed your ${side} hand by ${amount}!`, true);
    updateUI();
    if (!checkWin()) switchTurn();
}

/* ============================================================
   DICE TOSS — decides who strikes first.
   Dice rather than rock-paper-scissors: on one shared phone there is
   no way to hide a choice from the player sitting opposite you.
   ============================================================ */
const PIPS = {
    0: [],
    1: [[50, 50]],
    2: [[31, 31], [69, 69]],
    3: [[31, 31], [50, 50], [69, 69]],
    4: [[31, 31], [69, 31], [31, 69], [69, 69]],
    5: [[31, 31], [69, 31], [50, 50], [31, 69], [69, 69]],
    6: [[31, 28], [69, 28], [31, 50], [69, 50], [31, 72], [69, 72]]
};
let toss = { active: false, rolling: false, p1: 0, p2: 0 };

function renderDie(v, who) {
    const face = who === 'p1' ? 'var(--p1-soft)' : 'var(--p2-soft)';
    const waiting = v === 0;
    return `<svg viewBox="0 0 100 100" class="die-art${waiting ? ' waiting' : ''}">
        <rect x="6" y="6" width="88" height="88" rx="21"
              fill="${waiting ? 'transparent' : face}"
              stroke="var(--ink)" stroke-width="${waiting ? 3.5 : 5}"
              ${waiting ? 'stroke-dasharray="11 8" opacity=".4"' : ''}/>
        ${v === 0
            ? `<text x="50" y="54" text-anchor="middle" dominant-baseline="middle"
                     font-family="var(--font-display)" font-size="44" fill="var(--ink)" opacity=".3">?</text>`
            : PIPS[v].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="8.5" fill="var(--ink)"/>`).join('')}
    </svg>`;
}

function paintDice() {
    document.getElementById('die-p1').innerHTML = renderDie(toss.p1, 'p1');
    document.getElementById('die-p2').innerHTML = renderDie(toss.p2, 'p2');
}

function tossMsg(t) { document.getElementById('toss-msg').textContent = t; }

function openToss() {
    toss = { active: true, rolling: false, p1: 0, p2: 0 };
    gameState.locked = true;
    const el = document.getElementById('toss');
    el.hidden = false;
    el.classList.toggle('solo', gameState.mode === 'ai');
    document.getElementById('toss-p2-name').textContent = p2Label();
    const btn = document.getElementById('toss-roll');
    btn.disabled = false;
    btn.style.visibility = 'visible';
    btn.textContent = 'Roll the dice';
    ['die-p1', 'die-p2'].forEach(id => document.getElementById(id).classList.remove('won'));
    tossMsg('Highest roll goes first!');
    paintDice();
}

function rollToss() {
    if (!toss.active || toss.rolling) return;
    toss.rolling = true;
    playSound('dice');
    haptic(40);
    tossMsg('Rolling\u2026');
    document.getElementById('toss-roll').disabled = true;
    const dice = ['die-p1', 'die-p2'].map(id => document.getElementById(id));
    dice.forEach(d => { d.classList.add('rolling'); d.classList.remove('won'); });

    const spin = setInterval(() => {
        toss.p1 = 1 + ((Math.random() * 6) | 0);
        toss.p2 = 1 + ((Math.random() * 6) | 0);
        paintDice();
    }, 85);

    setTimeout(() => {
        clearInterval(spin);
        toss.p1 = 1 + ((Math.random() * 6) | 0);
        toss.p2 = 1 + ((Math.random() * 6) | 0);
        paintDice();
        dice.forEach(d => d.classList.remove('rolling'));
        toss.rolling = false;
        resolveToss();
    }, 1250);
}

function resolveToss() {
    if (toss.p1 === toss.p2) {
        playSound('tap');
        tossMsg(`Dead heat on ${toss.p1} \u2014 roll again!`);
        const btn = document.getElementById('toss-roll');
        btn.disabled = false;
        btn.textContent = 'Roll again';
        return;
    }
    // the roll is spent — let the dice have the moment
    document.getElementById('toss-roll').style.visibility = 'hidden';
    const p1Wins = toss.p1 > toss.p2;
    const winner = document.getElementById(p1Wins ? 'die-p1' : 'die-p2');
    winner.classList.add('won');
    playSound(p1Wins ? 'win' : 'ko');
    haptic(90);
    const r = winner.getBoundingClientRect();
    burstConfetti(r.left + r.width / 2, r.top + r.height / 2,
        p1Wins ? ['#2fa8e0', '#f4b32c', '#ffffff'] : ['#f0607d', '#8b7fa8'], 50);
    tossMsg(p1Wins
        ? `${toss.p1} beats ${toss.p2} \u2014 you strike first!`
        : `${toss.p2} beats ${toss.p1} \u2014 ${p2Label()} strikes first.`);
    setTimeout(() => beginPlay(p1Wins ? 'p1' : 'p2'), 1500);
}

function beginPlay(first) {
    document.getElementById('toss').hidden = true;
    ['die-p1', 'die-p2'].forEach(id => document.getElementById(id).classList.remove('won', 'rolling'));
    toss.active = false;
    gameState.locked = false;
    gameState.turn = first;
    say(first === 'p1'
        ? 'You go first! Pick a hand, then tap a rival hand.'
        : `${p2Label()} goes first.`);
    updateUI();
    if (gameState.mode === 'ai' && first === 'p2') setTimeout(cpuTurn, 950);
}

/* ============================================================
   WIN / RESET
   ============================================================ */
function checkWin() {
    const p1Out = gameState.p1.left === 0 && gameState.p1.right === 0;
    const p2Out = gameState.p2.left === 0 && gameState.p2.right === 0;
    if (!p1Out && !p2Out) return false;

    const youWon = p2Out;
    gameState.locked = true;
    recordResult(youWon ? 'p1' : 'p2');
    updateUI();

    if (youWon) {
        gameState.scores.p1++;
        playSound('win');
        burstConfetti(innerWidth / 2, innerHeight / 2, ['#2fa8e0', '#f4b32c', '#f0607d', '#34c79a', '#ffffff'], 150);
    } else {
        gameState.scores.p2++;
        playSound('lose');
        burstConfetti(innerWidth / 2, innerHeight / 2, ['#f0607d', '#8b7fa8', '#d6cfe0'], 70);
    }
    haptic(180);

    const parting = gameState.mode === 'ai'
        ? taunt(youWon ? 'beaten' : 'victory')
        : '';

    setTimeout(() => {
        setMood(youWon ? 'victory' : 'defeat');
        openSheet(
            youWon ? 'You win!' : `${p2Label()} wins!`,
            parting || (youWon ? 'Both rival hands are out. Flawless victory!'
                              : 'Your hands are out of fingers. Rematch?'),
            [{ label: 'Play again', action: resetGame }],
            youWon ? 'hero' : (gameState.mode === 'ai' ? rival().art : 'player2'),
            true,
            youWon ? 'p1' : 'p2'
        );
    }, 430);
    return true;
}

function resetGame() {
    gameState.turn = 'p1';
    gameState.selectedHand = null;
    gameState.activeSpecial = null;
    gameState.locked = false;
    gameState.rivalLine = null;
    gameState.p1 = { left: 1, right: 1, abilities: { subtraction: true, team: true } };
    gameState.p2 = { left: 1, right: 1, abilities: { subtraction: true, team: true } };
    lastValues = { p1: { left: 1, right: 1 }, p2: { left: 1, right: 1 } };
    setMood('battle');
    closeSheet();
    updateUI();
    openToss();
}

/* ============================================================
   SHEET
   ============================================================ */
function openSheet(title, body, actions, icon = 'spark', isPortrait = false, orientTo = null) {
    const facing = orientTo || gameState.turn;
    document.querySelector('.sheet').classList.toggle('flip',
        gameState.mode === 'pvp' && facing === 'p2');
    document.getElementById('sheet-title').textContent = title;
    const iconEl = document.getElementById('sheet-icon');
    iconEl.classList.toggle('portrait-frame', isPortrait);
    if (isPortrait) iconEl.innerHTML = renderPortrait(icon);
    else if (ICONS[icon]) iconEl.innerHTML = ICONS[icon];
    else iconEl.textContent = icon;

    const b = document.getElementById('sheet-body');
    b.className = 'sheet-body';
    if (typeof body === 'string') {
        b.textContent = isPortrait && gameState.mode === 'ai' ? `\u201c${body}\u201d` : body;
        if (isPortrait && gameState.mode === 'ai') b.classList.add('says');
    }
    else { b.innerHTML = ''; b.appendChild(body); b.classList.add('rules'); }

    const wrap = document.getElementById('sheet-actions');
    wrap.innerHTML = '';
    wrap.className = actions.length > 4 ? 'sheet-actions grid' : 'sheet-actions';
    actions.forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (a.ghost ? ' wide' : ' btn-gold');
        btn.textContent = a.label;
        btn.onclick = a.action;
        wrap.appendChild(btn);
    });
    document.getElementById('overlay').classList.add('show');
}

function closeSheet() { document.getElementById('overlay').classList.remove('show'); }

function showRules() {
    const d = document.createElement('div');
    d.innerHTML = `
        <p><b>First move:</b> both players roll a die — highest goes first.</p>
        <p><b>Goal:</b> knock out both of the rival's hands.</p>
        <p><b>Attack:</b> tap one of your hands, then a rival hand. Your fingers get added to theirs.</p>
        <p><b>5 or more:</b> that hand is knocked out for good.</p>
        <p><b>Shift:</b> slide fingers between your own hands instead of attacking.</p>
        <p><b>Half:</b> with one hand out and an even number on the other, split it in half to bring the dead hand back.</p>
        <p><b>Minus:</b> once per game, snip fingers off a rival hand.</p>
        <p><b>Team:</b> once per game, attack with both hands combined. Tap it again (or one of your own hands) to change your mind.</p>`;
    openSheet('How to play', d, [{ label: 'Got it!', action: closeSheet }], 'book');
}

/* ============================================================
   CONTROLS
   ============================================================ */
document.getElementById('mode-btn').addEventListener('click', () => {
    gameState.mode = gameState.mode === 'ai' ? 'pvp' : 'ai';
    gameState.scores = { p1: 0, p2: 0 };
    document.getElementById('mode-btn').textContent = gameState.mode === 'ai' ? 'VS CPU' : '2 PLAYER';
    document.getElementById('p2-name').textContent = p2Label();
    const pvp = gameState.mode === 'pvp';
    lastFoeArt = null;
    document.getElementById('p2-deck-avatar').innerHTML = renderPortrait('player2');
    document.getElementById('p2-deck').hidden = !pvp;
    document.getElementById('p2-nameplate').hidden = pvp;
    resetGame();
});

function paintIcons(root = document) {
    root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon] || ''; });
}

/* one mute control for effects and music together */
document.getElementById('sound-btn').addEventListener('click', e => {
    const on = !soundEnabled;
    soundEnabled = on;
    musicOn = on;
    e.currentTarget.innerHTML = on ? ICONS.soundOn : ICONS.soundOff;
    if (on) startMusic(); else stopMusic();
});

/* Browsers block audio until a gesture, and the gesture that works varies by
   browser — so keep trying on each one until the context is really running. */
const MUSIC_GESTURES = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'];
function tryStartMusic() {
    startMusic();
    setTimeout(() => {
        if (musicTimer && audioCtx && audioCtx.state === 'running') {
            MUSIC_GESTURES.forEach(ev => removeEventListener(ev, tryStartMusic));
        }
    }, 120);
}
MUSIC_GESTURES.forEach(ev => addEventListener(ev, tryStartMusic, { passive: true }));

document.getElementById('help-btn').addEventListener('click', showRules);
document.getElementById('score-btn').addEventListener('click', openStats);

loadSaved();
paintIcons();
document.getElementById('sound-btn').innerHTML = ICONS.soundOn;
document.getElementById('p1-avatar').innerHTML = renderPortrait('hero');
document.getElementById('p2-avatar').innerHTML = renderPortrait('rival');
updateUI();
openToss();

/* offline support only applies when served over http(s) — opening the file
   directly still works, it just skips this. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
